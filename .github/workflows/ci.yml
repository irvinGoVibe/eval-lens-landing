# CI gate: lint + typecheck + build + smoke e2e.
# Builds with BLOG_SOURCE=static so no Supabase env is needed in CI
# (the blog falls back to the checked-in static content).
name: CI

on:
  push:
    branches: [main, optimization]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      BLOG_SOURCE: static
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        # The test matrix runs chromium, firefox and webkit projects —
        # installing chromium alone left firefox/webkit failing to launch.
        run: pnpm exec playwright install --with-deps

      - name: Smoke e2e
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
