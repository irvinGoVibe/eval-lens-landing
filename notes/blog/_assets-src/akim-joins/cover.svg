<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1580" viewBox="0 0 3000 1580">
  <defs>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%" gradientTransform="rotate(28)">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="35%" stop-color="#A78BFA"/>
      <stop offset="70%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EEF2FB"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081527"/>
      <stop offset="48%" stop-color="#0A1024"/>
      <stop offset="100%" stop-color="#171038"/>
    </linearGradient>
    <linearGradient id="card-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2EC5E8" stop-opacity="0.82"/>
      <stop offset="52%" stop-color="#A99BFF" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#6C4CF1" stop-opacity="0.88"/>
    </linearGradient>
    <clipPath id="card-portrait-clip">
      <rect x="1880" y="140" width="960" height="960" rx="44"/>
    </clipPath>
    <filter id="card-shadow" x="-35%" y="-30%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="3000" height="1580" fill="#FFFFFF"/>
  <circle cx="2300" cy="790" r="640" fill="url(#halo)"/>

  <!-- kicker -->
  <text x="185" y="530" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" letter-spacing="10" fill="#3F4551">EVALLENS&#160;&#160;·&#160;&#160;PRESS RELEASE</text>

  <!-- headline -->
  <text x="180" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="#15181E">A new co-founder:</text>
  <text x="180" y="820" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="118" font-weight="800" fill="url(#lens)">Dr. Akim Golubev</text>

  <!-- dek -->
  <text x="183" y="935" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="49" fill="#6B7280">Ten years studying how judgment works.</text>
  <text x="183" y="1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="49" fill="#6B7280">Now building the lens with us.</text>

  <!-- right graphic: a complete founder card, matching the About-page treatment -->
  <g>
    <rect x="1804" y="84" width="1112" height="1412" rx="78" fill="#6C4CF1" opacity="0.12" filter="url(#card-shadow)"/>
    <rect x="1818" y="70" width="1084" height="1426" rx="76" fill="url(#card-bg)" stroke="url(#card-frame)" stroke-width="6"/>
    <rect x="1850" y="108" width="1020" height="1024" rx="54" fill="#050A16" stroke="#A99BFF" stroke-opacity="0.22" stroke-width="4"/>
    <image href="akim-cover-card.png" x="1880" y="140" width="960" height="960" preserveAspectRatio="xMidYMid meet" clip-path="url(#card-portrait-clip)"/>

    <line x1="1880" y1="1164" x2="2840" y2="1164" stroke="#A99BFF" stroke-opacity="0.24" stroke-width="3"/>
    <text x="2360" y="1250" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="34" font-weight="500" font-style="italic" fill="#F2F0FF">
      <tspan x="2360" dy="0">“I don't want to promise what I won't deliver.</tspan>
      <tspan x="2360" dy="56">But I'm ready to deliver everything I can.”</tspan>
    </text>
    <rect x="2220" y="1370" width="280" height="5" rx="3" fill="url(#lens)" opacity="0.88"/>
    <text x="2360" y="1432" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="23" font-weight="700" letter-spacing="5" fill="#36E0C2">DR. AKIM GOLUBEV</text>
  </g>
</svg>
