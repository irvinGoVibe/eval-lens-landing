<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">What Akim will actually be doing at EvalLens</title>
  <desc id="desc">Four roles: research and writing, podcasts and conversations, academic pilots, and presence in Silicon Valley.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="100" y="72" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" letter-spacing="0.16em">FOUR JOBS · ONE THINKING LAYER</text>
  <line x1="100" y1="104" x2="1500" y2="104" stroke="#d2d2d7"/>

  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
    <rect x="100" y="142" width="685" height="172" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="148" y="204" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">01</text>
    <text x="148" y="246" fill="#1d1d1f" font-size="26" font-weight="650">Research and writing</text>
    <text x="148" y="284" fill="#6e6e73" font-size="17">Essays and papers on evaluation and human-AI judgment</text>

    <rect x="815" y="142" width="685" height="172" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="863" y="204" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">02</text>
    <text x="863" y="246" fill="#1d1d1f" font-size="26" font-weight="650">Podcasts and conversations</text>
    <text x="863" y="284" fill="#6e6e73" font-size="17">Long-form interviews; the studio is being set up</text>

    <rect x="100" y="342" width="685" height="172" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="148" y="404" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">03</text>
    <text x="148" y="446" fill="#1d1d1f" font-size="26" font-weight="650">Academic pilots</text>
    <text x="148" y="484" fill="#6e6e73" font-size="17">A university pitch-day pilot, leaderboard kept human</text>

    <rect x="815" y="342" width="685" height="172" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="863" y="404" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">04</text>
    <text x="863" y="446" fill="#1d1d1f" font-size="26" font-weight="650">Being where the arguments happen</text>
    <text x="863" y="484" fill="#6e6e73" font-size="17">Lives and teaches in the middle of Silicon Valley</text>
  </g>

  <rect x="100" y="548" width="1400" height="118" rx="24" fill="url(#lens)"/>
  <text x="800" y="598" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.14em">THE JOB UNDERNEATH</text>
  <text x="800" y="638" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="24" font-weight="650">Make sure the theory can hold weight before anyone stands on it.</text>
</svg>
