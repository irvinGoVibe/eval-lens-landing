<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">The lever is the rubric, not the judge</title>
  <desc id="desc">Breaking judges reached ICC 0.21 to 0.45 while artistic-gymnastics judges reached ICC 0.94 to 0.98.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/><stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/><stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="100" y="78" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.16em">THE LEVER IS THE RUBRIC, NOT THE JUDGE</text>
  <line x1="100" y1="108" x2="1500" y2="108" stroke="#d2d2d7"/>

  <text x="100" y="192" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="19" font-weight="600">Breaking, Paris 2024</text>
  <text x="100" y="218" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">subjective criteria, young rubric</text>
  <line x1="220" y1="270" x2="1420" y2="270" stroke="#d2d2d7" stroke-width="2"/>
  <rect x="472" y="252" width="288" height="36" rx="18" fill="#1d1d1f" opacity="0.28"/>
  <text x="784" y="277" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="15" font-weight="700">ICC 0.21 to 0.45</text>

  <g stroke="#d2d2d7" stroke-width="2">
    <line x1="220" y1="264" x2="220" y2="282"/><line x1="520" y1="264" x2="520" y2="282"/>
    <line x1="820" y1="264" x2="820" y2="282"/><line x1="1120" y1="264" x2="1120" y2="282"/>
    <line x1="1420" y1="264" x2="1420" y2="282"/>
  </g>
  <g fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" text-anchor="middle">
    <text x="220" y="310">0.00</text><text x="520" y="310">0.25</text><text x="820" y="310">0.50</text><text x="1120" y="310">0.75</text><text x="1420" y="310">1.00</text>
  </g>

  <text x="100" y="390" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="19" font-weight="600">Artistic gymnastics</text>
  <text x="100" y="416" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">decades of anchored rubric</text>
  <text x="1420" y="450" text-anchor="end" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="15" font-weight="700">ICC 0.94 to 0.98</text>
  <line x1="220" y1="478" x2="1420" y2="478" stroke="#d2d2d7" stroke-width="2"/>
  <rect x="1348" y="460" width="48" height="36" rx="18" fill="url(#lens)"/>
  <g stroke="#d2d2d7" stroke-width="2">
    <line x1="220" y1="472" x2="220" y2="490"/><line x1="520" y1="472" x2="520" y2="490"/>
    <line x1="820" y1="472" x2="820" y2="490"/><line x1="1120" y1="472" x2="1120" y2="490"/>
    <line x1="1420" y1="472" x2="1420" y2="490"/>
  </g>
  <g fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" text-anchor="middle">
    <text x="220" y="518">0.00</text><text x="520" y="518">0.25</text><text x="820" y="518">0.50</text><text x="1120" y="518">0.75</text><text x="1420" y="518">1.00</text>
  </g>

  <line x1="100" y1="602" x2="1500" y2="602" stroke="#d2d2d7"/>
  <text x="100" y="650" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Expert judges at the same level of event. The difference is how precisely the thing being scored was defined.</text>
</svg>
