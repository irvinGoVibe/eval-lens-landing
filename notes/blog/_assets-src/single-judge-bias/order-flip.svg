<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Position bias flips the picked deck</title>
  <desc id="desc">The same two decks swap order, and the selected deck changes with the first position.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(118 .5 .5)">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset=".32" stop-color="#a99bff"/>
      <stop offset=".68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
    <style>
      .sf{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:Menlo,ui-monospace,monospace}
      .eyebrow{font-size:12px;fill:#6c4cf1;letter-spacing:.16em}
      .deck{font-size:56px;font-weight:600;fill:#1d1d1f}
      .picked{font-size:12px;fill:#6e6e73;letter-spacing:.14em}
      .swap{font-size:12px;fill:#6e6e73;letter-spacing:.14em}
      .conclusion{font-size:16px;font-weight:600;fill:#1d1d1f}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>
  <text x="120" y="84" class="mono eyebrow">POSITION BIAS</text>

  <path d="M580 360C704 376 896 424 1020 456" fill="none" stroke="#6c4cf1" stroke-width="3" stroke-linecap="round"/>
  <path d="M1020 360C896 376 704 424 580 456" fill="none" stroke="#2ec5e8" stroke-width="3" stroke-linecap="round"/>
  <path d="M1020 456L1005 458L1008 447Z" fill="#6c4cf1"/>
  <path d="M580 456L592 447L595 458Z" fill="#2ec5e8"/>
  <rect x="712" y="378" width="176" height="28" rx="14" fill="#fff" stroke="#d2d2d7"/>
  <text x="800" y="396" text-anchor="middle" class="mono swap">ORDER SWAPPED</text>

  <g transform="translate(408 152)">
    <rect width="144" height="192" rx="12" fill="#fff" stroke="url(#lens)" stroke-width="3"/>
    <text x="72" y="120" text-anchor="middle" class="sf deck">A</text>
    <circle cx="72" cy="-24" r="12" fill="url(#lens)"/>
    <path d="M66 -24l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="-48" text-anchor="middle" class="mono picked">PICKED</text>
  </g>
  <g transform="translate(1048 152)">
    <rect width="144" height="192" rx="12" fill="#fff" stroke="#d2d2d7"/>
    <text x="72" y="120" text-anchor="middle" class="sf deck">B</text>
  </g>

  <g transform="translate(408 472)">
    <rect width="144" height="192" rx="12" fill="#fff" stroke="url(#lens)" stroke-width="3"/>
    <text x="72" y="120" text-anchor="middle" class="sf deck">B</text>
    <circle cx="72" cy="-24" r="12" fill="url(#lens)"/>
    <path d="M66 -24l4 4 8-9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="-48" text-anchor="middle" class="mono picked">PICKED</text>
  </g>
  <g transform="translate(1048 472)">
    <rect width="144" height="192" rx="12" fill="#fff" stroke="#d2d2d7"/>
    <text x="72" y="120" text-anchor="middle" class="sf deck">A</text>
  </g>

  <circle cx="596" cy="720" r="7" fill="url(#lens)"/>
  <text x="620" y="726" class="sf conclusion">same decks · new order · new verdict</text>
</svg>
