<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">ERC and NIH rules draw two different fences</title>
  <desc id="desc">ERC rules keep judgment human; NIH rules keep confidential application content inside controlled infrastructure.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="100" y="72" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" letter-spacing="0.16em">TWO RULES · TWO LOGICS</text>
  <line x1="100" y1="104" x2="1500" y2="104" stroke="#d2d2d7"/>

  <rect x="100" y="142" width="1400" height="350" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
  <line x1="800" y1="142" x2="800" y2="492" stroke="#d2d2d7" stroke-width="2"/>

  <g aria-label="ERC March 2026">
    <text x="148" y="204" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">ERC · MARCH 2026</text>
    <text x="148" y="252" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="29" font-weight="650">Judgment cannot be delegated</text>
    <g fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="17">
      <circle cx="154" cy="315" r="5"/><text x="176" y="321">No AI summaries of proposals</text>
      <circle cx="154" cy="369" r="5"/><text x="176" y="375">No merit assessment or draft reviews</text>
      <circle cx="154" cy="423" r="5"/><text x="176" y="429">No proposal content in external AI tools</text>
    </g>
  </g>

  <g aria-label="NIH 2023">
    <text x="848" y="204" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">NIH · 2023</text>
    <text x="848" y="252" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="29" font-weight="650">Confidentiality cannot leave</text>
    <g fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="17">
      <circle cx="854" cy="315" r="5"/><text x="876" y="321">No generative-AI application analysis</text>
      <circle cx="854" cy="369" r="5"/><text x="876" y="375">No AI-formulated critiques</text>
      <circle cx="854" cy="423" r="5"/><text x="876" y="429">Confidential content stays controlled</text>
    </g>
  </g>

  <rect x="100" y="548" width="1400" height="118" rx="24" fill="url(#lens)"/>
  <text x="800" y="598" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.14em">THE SHARED BOUNDARY</text>
  <text x="800" y="638" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="24" font-weight="650">Two fences. One boundary: administration is open, judgment is human.</text>
</svg>
