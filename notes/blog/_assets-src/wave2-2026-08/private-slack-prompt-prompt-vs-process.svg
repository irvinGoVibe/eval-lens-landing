<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A prompt and a process can use the same model with different discipline</title>
  <desc id="desc">A fixed rubric, cited evidence, deterministic output, and a named human signature distinguish a process from an informal prompt.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
    <g id="check" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-10 0l7 8 15-18"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="100" y="72" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" letter-spacing="0.16em">SAME MODEL · DIFFERENT DISCIPLINE</text>
  <line x1="100" y1="104" x2="1500" y2="104" stroke="#d2d2d7"/>

  <rect x="100" y="132" width="1400" height="100" rx="20" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
  <text x="140" y="192" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18" font-weight="650">OPERATION</text>
  <text x="985" y="192" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">PROMPT</text>
  <text x="1315" y="192" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.14em">PROCESS</text>

  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif">
    <rect x="100" y="252" width="1400" height="100" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="140" y="312" fill="#1d1d1f" font-size="21" font-weight="600">Rubric fixed?</text>
    <text x="985" y="317" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="30">—</text>
    <g color="#1d1d1f" transform="translate(1240 302)"><use href="#check"/></g>
    <text x="1274" y="310" fill="#1d1d1f" font-size="17">Versioned</text>

    <rect x="100" y="372" width="1400" height="100" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="140" y="432" fill="#1d1d1f" font-size="21" font-weight="600">Evidence cited?</text>
    <text x="985" y="437" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="30">—</text>
    <g color="#1d1d1f" transform="translate(1240 422)"><use href="#check"/></g>
    <text x="1274" y="430" fill="#1d1d1f" font-size="17">Anchored</text>

    <rect x="100" y="492" width="1400" height="100" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <text x="140" y="552" fill="#1d1d1f" font-size="21" font-weight="600">Same input, same score?</text>
    <text x="985" y="557" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="30">—</text>
    <g color="#1d1d1f" transform="translate(1240 542)"><use href="#check"/></g>
    <text x="1274" y="550" fill="#1d1d1f" font-size="17">Deterministic</text>

    <rect x="100" y="612" width="1400" height="112" rx="18" fill="url(#lens)"/>
    <text x="140" y="680" fill="#ffffff" font-size="21" font-weight="650">Who signed?</text>
    <text x="985" y="685" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="30">—</text>
    <g color="#ffffff" transform="translate(1240 670)"><use href="#check"/></g>
    <text x="1274" y="678" fill="#ffffff" font-size="17" font-weight="650">Named human</text>
  </g>

  <line x1="100" y1="782" x2="1500" y2="782" stroke="#d2d2d7"/>
  <text x="800" y="842" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="25" font-weight="650">The models are the same. The discipline is the difference.</text>
</svg>
