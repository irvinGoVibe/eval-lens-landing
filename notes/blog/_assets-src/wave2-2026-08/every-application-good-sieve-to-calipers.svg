<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">The screening job changed from sieving to measuring</title>
  <desc id="desc">The weak share fell from 20 percent in 2019 to 5 percent in 2025 while application volume rose 57 percent.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="100" y="72" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" letter-spacing="0.16em">THE JOB CHANGED</text>
  <line x1="100" y1="104" x2="1500" y2="104" stroke="#d2d2d7"/>

  <g aria-label="2019, 20 percent weak">
    <text x="135" y="176" fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.12em">THE SIEVE</text>
    <text x="135" y="216" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="28" font-weight="650">2019 · 20% weak</text>
    <path d="M150 270H640L500 488H362Z" fill="#ffffff" stroke="#1d1d1f" stroke-width="3" stroke-linejoin="round"/>
    <g stroke="#d2d2d7" stroke-width="2">
      <line x1="202" y1="270" x2="382" y2="488"/><line x1="288" y1="270" x2="420" y2="488"/>
      <line x1="374" y1="270" x2="458" y2="488"/><line x1="460" y1="270" x2="496" y2="488"/>
      <line x1="546" y1="270" x2="458" y2="488"/>
      <line x1="192" y1="334" x2="598" y2="334"/><line x1="230" y1="394" x2="560" y2="394"/><line x1="284" y1="452" x2="522" y2="452"/>
    </g>
    <g fill="#1d1d1f"><circle cx="396" cy="535" r="10"/><circle cx="430" cy="550" r="7"/><circle cx="464" cy="530" r="9"/></g>
  </g>

  <g aria-label="57 percent volume increase">
    <path d="M730 330H878V288L970 380L878 472V430H730Z" fill="url(#lens)"/>
    <text x="850" y="532" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700" letter-spacing="0.08em">+57% VOLUME</text>
  </g>

  <g aria-label="2025, 5 percent weak">
    <text x="1035" y="176" fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.12em">THE CALIPERS</text>
    <text x="1035" y="216" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="28" font-weight="650">2025 · 5% weak</text>
    <rect x="1080" y="296" width="120" height="236" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="3"/>
    <rect x="1250" y="296" width="120" height="236" rx="12" fill="#ffffff" stroke="#d2d2d7" stroke-width="3"/>
    <rect x="1048" y="268" width="354" height="20" rx="10" fill="url(#lens)"/>
    <rect x="1048" y="268" width="18" height="104" rx="9" fill="url(#lens)"/>
    <rect x="1384" y="268" width="18" height="104" rx="9" fill="url(#lens)"/>
    <line x1="1200" y1="414" x2="1250" y2="414" stroke="#1d1d1f" stroke-width="3"/>
    <path d="M1200 414l15-10v20zM1250 414l-15-10v20z" fill="#1d1d1f"/>
    <text x="1225" y="462" text-anchor="middle" fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.1em">FINE GAP</text>
  </g>

  <line x1="100" y1="632" x2="1500" y2="632" stroke="#d2d2d7"/>
  <text x="100" y="676" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">Source: Times Higher Education · 12 research funders, volume 2022–2025; quality threshold 2018–2025</text>
</svg>
