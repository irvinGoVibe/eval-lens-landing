<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Three hidden invoices from a private screening prompt</title>
  <desc id="desc">Irreproducibility, invented evidence, and no audit trail are the delayed costs of an informal prompt workflow.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="100" y="72" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" letter-spacing="0.16em">THE INVOICES ARRIVE LATER</text>
  <line x1="100" y1="104" x2="1500" y2="104" stroke="#d2d2d7"/>

  <g aria-label="Invoice one, irreproducibility">
    <rect x="100" y="154" width="440" height="464" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <circle cx="172" cy="230" r="42" fill="url(#lens)"/>
    <text x="172" y="239" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="20" font-weight="700">01</text>
    <text x="140" y="326" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="25" font-weight="650">Irreproducibility</text>
    <text x="140" y="388" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18">
      <tspan x="140" dy="0">Up to 60% same-input</tspan>
      <tspan x="140" dy="30">score variance.</tspan>
    </text>
    <line x1="140" y1="488" x2="500" y2="488" stroke="#d2d2d7"/>
    <text x="140" y="530" fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.06em">MARKINMINUTES GRADING TEST</text>
  </g>

  <g aria-label="Invoice two, invented evidence">
    <rect x="580" y="154" width="440" height="464" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <circle cx="652" cy="230" r="42" fill="url(#lens)"/>
    <text x="652" y="239" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="20" font-weight="700">02</text>
    <text x="620" y="326" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="25" font-weight="650">Invented evidence</text>
    <text x="620" y="388" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18">
      <tspan x="620" dy="0">17–33% hallucination</tspan>
      <tspan x="620" dy="30">measured against claims of</tspan>
      <tspan x="620" dy="30">“hallucination-free.”</tspan>
    </text>
    <line x1="620" y1="488" x2="980" y2="488" stroke="#d2d2d7"/>
    <text x="620" y="530" fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.06em">STANFORD REGLAB</text>
  </g>

  <g aria-label="Invoice three, no trail">
    <rect x="1060" y="154" width="440" height="464" rx="24" fill="#ffffff" stroke="#d2d2d7" stroke-width="2"/>
    <circle cx="1132" cy="230" r="42" fill="url(#lens)"/>
    <text x="1132" y="239" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="20" font-weight="700">03</text>
    <text x="1100" y="326" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="25" font-weight="650">No trail</text>
    <text x="1100" y="388" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="18">
      <tspan x="1100" dy="0">Nothing to show when</tspan>
      <tspan x="1100" dy="30">someone asks why.</tspan>
    </text>
    <line x1="1100" y1="488" x2="1460" y2="488" stroke="#d2d2d7"/>
    <text x="1100" y="530" fill="#6e6e73" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.06em">DEVELOPMENT CORPORATE</text>
  </g>

  <text x="800" y="690" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16">Convenience is immediate. Accountability is billed later.</text>
</svg>
