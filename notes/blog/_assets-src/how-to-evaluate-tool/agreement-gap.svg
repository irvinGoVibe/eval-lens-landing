<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t d">
<title id="t">Correlation versus agreement</title><desc id="d">Tool scores track the team's ranking but sit systematically lower, so correlation is high while kappa is low</desc>
<defs><linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#6c4cf1"/><stop offset="0.32" stop-color="#a99bff"/>
<stop offset="0.68" stop-color="#2ec5e8"/><stop offset="1" stop-color="#36e0c2"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<rect width="1600" height="760" fill="#ffffff"/><text x="100" y="78" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.16em">CORRELATION IS NOT AGREEMENT</text><line x1="100" y1="108" x2="1500" y2="108" stroke="#d2d2d7" stroke-width="1"/><circle cx="300" cy="198" r="11" fill="#1d1d1f"/><circle cx="300" cy="338" r="11" fill="url(#lens)"/><line x1="300" y1="198" x2="300" y2="338" stroke="#d2d2d7" stroke-width="2" stroke-dasharray="4 5"/><circle cx="480" cy="277" r="11" fill="#1d1d1f"/><circle cx="480" cy="418" r="11" fill="url(#lens)"/><line x1="480" y1="277" x2="480" y2="418" stroke="#d2d2d7" stroke-width="2" stroke-dasharray="4 5"/><circle cx="660" cy="338" r="11" fill="#1d1d1f"/><circle cx="660" cy="479" r="11" fill="url(#lens)"/><line x1="660" y1="338" x2="660" y2="479" stroke="#d2d2d7" stroke-width="2" stroke-dasharray="4 5"/><circle cx="840" cy="409" r="11" fill="#1d1d1f"/><circle cx="840" cy="550" r="11" fill="url(#lens)"/><line x1="840" y1="409" x2="840" y2="550" stroke="#d2d2d7" stroke-width="2" stroke-dasharray="4 5"/><circle cx="1020" cy="479" r="11" fill="#1d1d1f"/><circle cx="1020" cy="620" r="11" fill="url(#lens)"/><line x1="1020" y1="479" x2="1020" y2="620" stroke="#d2d2d7" stroke-width="2" stroke-dasharray="4 5"/><circle cx="1200" cy="541" r="11" fill="#1d1d1f"/><circle cx="1200" cy="682" r="11" fill="url(#lens)"/><line x1="1200" y1="541" x2="1200" y2="682" stroke="#d2d2d7" stroke-width="2" stroke-dasharray="4 5"/><polyline points="300,198 480,277 660,338 840,409 1020,479 1200,541" fill="none" stroke="#1d1d1f" stroke-width="2" opacity="0.35"/><polyline points="300,338 480,418 660,479 840,550 1020,620 1200,682" fill="none" stroke="url(#lens)" stroke-width="3" opacity="0.75"/><text x="1230" y="198" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600">your reviewers</text><text x="1230" y="344" fill="#6c4cf1" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16" font-weight="600">the tool</text><text x="100" y="690" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Same ranking, every score shifted down. Correlation stays near perfect; Cohen's kappa does not.</text></svg>