<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Eleven questions for an evaluation-tool vendor</title>
  <desc id="desc">Eleven vendor questions grouped into the number, agreement, record, and relationship.</desc>
  <defs>
    <linearGradient id="lens" gradientUnits="userSpaceOnUse" x1="100" y1="560" x2="1490" y2="140">
      <stop offset="0" stop-color="#6c4cf1"/><stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/><stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="760" fill="#ffffff"/>
  <text x="100" y="78" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.16em">ELEVEN QUESTIONS, FOUR GROUPS</text>
  <line x1="100" y1="108" x2="1500" y2="108" stroke="#d2d2d7"/>

  <g>
    <rect x="100" y="146" width="325" height="400" rx="18" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="100" y="146" width="325" height="6" rx="3" fill="url(#lens)"/>
    <text x="126" y="194" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON THE NUMBER</text>
    <circle cx="140" cy="246" r="17" fill="url(#lens)"/><text x="140" y="252" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">1</text>
    <text x="170" y="242" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">How many runs before</text><text x="170" y="264" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">this figure?</text>
    <circle cx="140" cy="342" r="17" fill="url(#lens)"/><text x="140" y="348" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">2</text>
    <text x="170" y="338" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">What is it on data you</text><text x="170" y="360" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">never saw?</text>
    <circle cx="140" cy="438" r="17" fill="url(#lens)"/><text x="140" y="444" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">3</text>
    <text x="170" y="434" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Is the scoring prompt</text><text x="170" y="456" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">frozen?</text>
  </g>

  <g>
    <rect x="455" y="146" width="325" height="400" rx="18" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="455" y="146" width="325" height="6" rx="3" fill="url(#lens)"/>
    <text x="481" y="194" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON AGREEMENT</text>
    <circle cx="495" cy="246" r="17" fill="url(#lens)"/><text x="495" y="252" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">4</text>
    <text x="525" y="242" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Kappa against human</text><text x="525" y="264" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">labels?</text>
    <circle cx="495" cy="342" r="17" fill="url(#lens)"/><text x="495" y="348" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">5</text>
    <text x="525" y="338" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Humans' agreement with</text><text x="525" y="360" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">each other?</text>
    <circle cx="495" cy="438" r="17" fill="url(#lens)"/><text x="495" y="444" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">6</text>
    <text x="525" y="434" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Which models judge,</text><text x="525" y="456" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">how many?</text>
  </g>

  <g>
    <rect x="810" y="146" width="325" height="400" rx="18" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="810" y="146" width="325" height="6" rx="3" fill="url(#lens)"/>
    <text x="836" y="194" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON THE RECORD</text>
    <circle cx="850" cy="246" r="17" fill="url(#lens)"/><text x="850" y="252" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">7</text>
    <text x="880" y="242" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Every claim linked to</text><text x="880" y="264" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">its page?</text>
    <circle cx="850" cy="342" r="17" fill="url(#lens)"/><text x="850" y="348" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">8</text>
    <text x="880" y="338" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Same input, same score</text><text x="880" y="360" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">next week?</text>
    <circle cx="850" cy="438" r="17" fill="url(#lens)"/><text x="850" y="444" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700">9</text>
    <text x="880" y="434" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Where does my</text><text x="880" y="456" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">document go?</text>
  </g>

  <g>
    <rect x="1165" y="146" width="325" height="304" rx="18" fill="#ffffff" stroke="#d2d2d7"/>
    <rect x="1165" y="146" width="325" height="6" rx="3" fill="url(#lens)"/>
    <text x="1191" y="194" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.12em">ON THE RELATIONSHIP</text>
    <circle cx="1205" cy="246" r="17" fill="url(#lens)"/><text x="1205" y="252" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700">10</text>
    <text x="1235" y="242" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Do I keep my history</text><text x="1235" y="264" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">and rubric?</text>
    <circle cx="1205" cy="342" r="17" fill="url(#lens)"/><text x="1205" y="348" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700">11</text>
    <text x="1235" y="338" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Does the contract</text><text x="1235" y="360" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">warrant the site?</text>
  </g>

  <line x1="100" y1="598" x2="1500" y2="598" stroke="#d2d2d7"/>
  <text x="100" y="642" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Send them before the demo. A vendor who will not put a marketing number into a contract has answered question eleven.</text>
</svg>
