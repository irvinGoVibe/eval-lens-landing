<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">Buyer questions in four groups</title><desc id="d">Eleven vendor questions grouped into number, agreement, record and relationship</desc>
<defs><linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
<stop offset="0" stop-color="#6c4cf1"/><stop offset="0.32" stop-color="#a99bff"/>
<stop offset="0.68" stop-color="#2ec5e8"/><stop offset="1" stop-color="#36e0c2"/></linearGradient><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12"/></filter></defs>
<rect width="1600" height="900" fill="#ffffff"/><text x="100" y="78" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.16em">ELEVEN QUESTIONS, FOUR GROUPS</text><line x1="100" y1="108" x2="1500" y2="108" stroke="#d2d2d7" stroke-width="1"/><rect x="100" y="150" width="325" height="462" rx="18" fill="#ffffff" stroke="#d2d2d7"/><rect x="100" y="150" width="325" height="6" rx="3" fill="url(#lens)"/><text x="126" y="205" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON THE NUMBER</text><circle cx="140" cy="272" r="17" fill="url(#lens)"/><text x="140" y="278" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">1</text><text x="170" y="268" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">How many runs before</text><text x="170" y="290" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">this figure?</text><circle cx="140" cy="376" r="17" fill="url(#lens)"/><text x="140" y="382" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">2</text><text x="170" y="372" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">What is it on data you</text><text x="170" y="394" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">never saw?</text><circle cx="140" cy="480" r="17" fill="url(#lens)"/><text x="140" y="486" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">3</text><text x="170" y="476" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Is the scoring prompt</text><text x="170" y="498" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">frozen?</text><rect x="455" y="150" width="325" height="462" rx="18" fill="#ffffff" stroke="#d2d2d7"/><rect x="455" y="150" width="325" height="6" rx="3" fill="url(#lens)"/><text x="481" y="205" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON AGREEMENT</text><circle cx="495" cy="272" r="17" fill="url(#lens)"/><text x="495" y="278" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">4</text><text x="525" y="268" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Kappa against human</text><text x="525" y="290" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">labels?</text><circle cx="495" cy="376" r="17" fill="url(#lens)"/><text x="495" y="382" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">5</text><text x="525" y="372" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Humans' agreement with</text><text x="525" y="394" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">each other?</text><circle cx="495" cy="480" r="17" fill="url(#lens)"/><text x="495" y="486" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">6</text><text x="525" y="476" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Which models judge, how</text><text x="525" y="498" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">many?</text><rect x="810" y="150" width="325" height="462" rx="18" fill="#ffffff" stroke="#d2d2d7"/><rect x="810" y="150" width="325" height="6" rx="3" fill="url(#lens)"/><text x="836" y="205" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON THE RECORD</text><circle cx="850" cy="272" r="17" fill="url(#lens)"/><text x="850" y="278" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">7</text><text x="880" y="268" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Every claim linked to</text><text x="880" y="290" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">its page?</text><circle cx="850" cy="376" r="17" fill="url(#lens)"/><text x="850" y="382" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">8</text><text x="880" y="372" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Same input, same score</text><text x="880" y="394" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">next week?</text><circle cx="850" cy="480" r="17" fill="url(#lens)"/><text x="850" y="486" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">9</text><text x="880" y="476" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Where does my document</text><text x="880" y="498" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">go?</text><rect x="1165" y="150" width="325" height="358" rx="18" fill="#ffffff" stroke="#d2d2d7"/><rect x="1165" y="150" width="325" height="6" rx="3" fill="url(#lens)"/><text x="1191" y="205" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="12" font-weight="700" letter-spacing="0.14em">ON THE RELATIONSHIP</text><circle cx="1205" cy="272" r="17" fill="url(#lens)"/><text x="1205" y="278" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">10</text><text x="1235" y="268" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Do I keep my history and</text><text x="1235" y="290" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">rubric?</text><circle cx="1205" cy="376" r="17" fill="url(#lens)"/><text x="1205" y="382" text-anchor="middle" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="14" font-weight="700">11</text><text x="1235" y="372" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Does the contract the</text><text x="1235" y="394" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">warrant site?</text><text x="100" y="830" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">Send them before the demo. A vendor who will not put a marketing number into a contract has answered question eleven.</text></svg>