<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.7" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="lensSoft" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="capsuleClip">
      <rect x="560" y="330" width="480" height="240" rx="120"/>
    </clipPath>
  </defs>

  <rect width="1600" height="900" fill="#07070b"/>
  <circle cx="800" cy="450" r="420" fill="url(#glow)"/>

  <!-- incoming plain lanes (public, faded, stop at the capsule) -->
  <g stroke="#2a2a33" stroke-width="1.5">
    <line x1="80" y1="390" x2="540" y2="390"/>
    <line x1="80" y1="450" x2="540" y2="450"/>
    <line x1="80" y1="510" x2="540" y2="510"/>
  </g>
  <!-- deck glyphs entering -->
  <g fill="none" stroke="#4b4b58" stroke-width="2">
    <rect x="180" y="368" width="34" height="44" rx="4"/>
    <rect x="300" y="428" width="34" height="44" rx="4"/>
    <rect x="220" y="488" width="34" height="44" rx="4"/>
  </g>
  <g stroke="#4b4b58" stroke-width="2" stroke-linecap="round">
    <line x1="188" y1="382" x2="206" y2="382"/><line x1="188" y1="392" x2="200" y2="392"/>
    <line x1="308" y1="442" x2="326" y2="442"/><line x1="308" y1="452" x2="320" y2="452"/>
    <line x1="228" y1="502" x2="246" y2="502"/><line x1="228" y1="512" x2="240" y2="512"/>
  </g>

  <!-- isolated capsule: glass enclosure with lens-gradient hairline -->
  <rect x="560" y="330" width="480" height="240" rx="120" fill="#0b0b12" stroke="url(#lens)" stroke-width="2.5"/>
  <rect x="576" y="346" width="448" height="208" rx="104" fill="none" stroke="url(#lensSoft)" stroke-width="1"/>
  <!-- lanes continue inside, gradient -->
  <g clip-path="url(#capsuleClip)" stroke="url(#lens)" stroke-width="2">
    <line x1="560" y1="390" x2="1040" y2="390"/>
    <line x1="560" y1="450" x2="1040" y2="450"/>
    <line x1="560" y1="510" x2="1040" y2="510"/>
  </g>
  <!-- keyhole-free lock idea: a lens circle at capsule center -->
  <circle cx="800" cy="450" r="58" fill="#07070b" stroke="url(#lens)" stroke-width="2.5"/>
  <circle cx="800" cy="450" r="34" fill="none" stroke="url(#lens)" stroke-width="1.5" opacity="0.7"/>
  <circle cx="800" cy="450" r="12" fill="url(#lens)"/>

  <!-- outgoing single ranked lane -->
  <line x1="1040" y1="450" x2="1520" y2="450" stroke="url(#lens)" stroke-width="2.5"/>
  <!-- ranked report glyphs leaving -->
  <g fill="none" stroke="url(#lens)" stroke-width="2">
    <rect x="1180" y="428" width="34" height="44" rx="4"/>
    <rect x="1320" y="428" width="34" height="44" rx="4"/>
  </g>
  <g stroke="url(#lens)" stroke-width="2" stroke-linecap="round">
    <line x1="1188" y1="442" x2="1206" y2="442"/><line x1="1188" y1="452" x2="1202" y2="452"/>
    <line x1="1188" y1="462" x2="1198" y2="462"/>
    <line x1="1328" y1="442" x2="1346" y2="442"/><line x1="1328" y1="452" x2="1342" y2="452"/>
    <line x1="1328" y1="462" x2="1338" y2="462"/>
  </g>

  <!-- hairline frame -->
  <rect x="40" y="40" width="1520" height="820" rx="24" fill="none" stroke="#1c1c24" stroke-width="1"/>
</svg>
