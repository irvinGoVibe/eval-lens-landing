<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">What changes between programs and what does not</title>
  <desc id="desc">Swappable program settings on top, the invariant review engine underneath, human Jury Score highlighted.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.8" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#d2d2d7"/>
    </marker>
    <filter id="railGlow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="decisionGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="90" y="82" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.16em">CHANGES PER PROGRAM</text>
  <line x1="90" y1="112" x2="1510" y2="112" stroke="#d2d2d7" stroke-width="1"/>

  <g aria-label="Mode and panel cartridge">
    <rect x="90" y="156" width="400" height="260" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
    <text x="128" y="214" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">Mode &amp; panel</text>
    <rect x="128" y="260" width="324" height="42" rx="21" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="290" y="286" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">Pitch · 6 judges</text>
    <rect x="128" y="320" width="324" height="42" rx="21" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="290" y="346" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">Hackathon · 5 judges</text>
  </g>

  <g aria-label="Criteria weights cartridge">
    <rect x="600" y="156" width="400" height="260" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
    <text x="638" y="214" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">Criteria weights</text>
    <line x1="640" y1="273" x2="948" y2="273" stroke="#d2d2d7" stroke-width="6" stroke-linecap="round"/>
    <rect x="640" y="270" width="214" height="6" rx="3" fill="#1d1d1f"/>
    <circle cx="854" cy="273" r="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <line x1="640" y1="313" x2="948" y2="313" stroke="#d2d2d7" stroke-width="6" stroke-linecap="round"/>
    <rect x="640" y="310" width="137" height="6" rx="3" fill="#1d1d1f"/>
    <circle cx="777" cy="313" r="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
    <line x1="640" y1="353" x2="948" y2="353" stroke="#d2d2d7" stroke-width="6" stroke-linecap="round"/>
    <rect x="640" y="350" width="266" height="6" rx="3" fill="#1d1d1f"/>
    <circle cx="906" cy="353" r="8" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/>
  </g>

  <g aria-label="Intake cartridge">
    <rect x="1110" y="156" width="400" height="260" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1"/>
    <text x="1148" y="214" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="20" font-weight="600">Intake</text>
    <rect x="1148" y="260" width="126" height="42" rx="21" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="1211" y="286" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">manual</text>
    <rect x="1292" y="260" width="180" height="42" rx="21" fill="#ffffff" stroke="#d2d2d7"/>
    <text x="1382" y="286" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14">public upload page</text>
  </g>

  <g fill="none" stroke="#d2d2d7" stroke-width="1" stroke-dasharray="5 7">
    <path d="M290 416V558"/>
    <path d="M800 416V558"/>
    <path d="M1310 416V558"/>
  </g>
  <g fill="#ffffff" stroke="#d2d2d7">
    <circle cx="290" cy="558" r="5"/>
    <circle cx="800" cy="558" r="5"/>
    <circle cx="1310" cy="558" r="5"/>
  </g>

  <rect x="90" y="558" width="1420" height="334" rx="26" fill="none" stroke="url(#lens)" stroke-width="14" opacity="0.2" filter="url(#railGlow)"/>
  <rect x="90" y="558" width="1420" height="334" rx="26" fill="#ffffff" stroke="url(#lens)" stroke-width="3"/>
  <rect x="93" y="561" width="1414" height="96" rx="23" fill="url(#lens)"/>
  <text x="130" y="618" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="13" font-weight="700" letter-spacing="0.16em">NEVER CHANGES</text>
  <line x1="130" y1="682" x2="1470" y2="682" stroke="#d2d2d7" stroke-width="1"/>

  <g stroke="#d2d2d7" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="252" y1="754" x2="444" y2="754"/>
    <line x1="537" y1="754" x2="720" y2="754"/>
    <line x1="842" y1="754" x2="1000" y2="754"/>
    <line x1="1112" y1="754" x2="1312" y2="754"/>
  </g>

  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" text-anchor="middle">
    <circle cx="220" cy="754" r="9" fill="#1d1d1f"/>
    <text x="220" y="812" fill="#1d1d1f">independent</text>
    <text x="220" y="832" fill="#1d1d1f">judges</text>

    <circle cx="505" cy="754" r="9" fill="#1d1d1f"/>
    <text x="505" y="812" fill="#1d1d1f">evidence-linked</text>
    <text x="505" y="832" fill="#1d1d1f">scores</text>

    <circle cx="810" cy="754" r="9" fill="#1d1d1f"/>
    <text x="810" y="812" fill="#1d1d1f">AI Total Score</text>
    <text x="810" y="832" fill="#6e6e73">advisory</text>

    <circle cx="1080" cy="754" r="44" fill="url(#lens)" opacity="0.34" filter="url(#decisionGlow)"/>
    <circle cx="1080" cy="754" r="22" fill="url(#lens)"/>
    <text x="1080" y="812" fill="#1d1d1f" font-weight="600">Jury Score</text>
    <text x="1080" y="832" fill="#1d1d1f" font-weight="600">human</text>

    <circle cx="1380" cy="754" r="9" fill="#1d1d1f"/>
    <text x="1380" y="812" fill="#1d1d1f">reconstructible</text>
    <text x="1380" y="832" fill="#1d1d1f">trail</text>
  </g>
</svg>
