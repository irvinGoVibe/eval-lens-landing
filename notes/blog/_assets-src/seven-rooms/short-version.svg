<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">The EvalLens fit test</title>
  <desc id="desc">Three factors multiplied: volume, capacity, exposure equals a defensible shortlist.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset="0.32" stop-color="#a99bff"/>
      <stop offset="0.68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="1600" height="760" fill="#ffffff"/>

  <text x="100" y="82" fill="#6c4cf1" font-family="Menlo, ui-monospace, monospace" font-size="12" letter-spacing="0.16em">THE FIT TEST</text>
  <line x1="100" y1="112" x2="1500" y2="112" stroke="#d2d2d7" stroke-width="1"/>

  <g aria-label="Volume">
    <circle cx="285" cy="334" r="118" fill="url(#lens)" fill-opacity="0.05" stroke="#d2d2d7" stroke-width="2"/>
    <circle cx="285" cy="334" r="118" fill="none" stroke="url(#lens)" stroke-width="12" stroke-linecap="round" stroke-dasharray="270 472" transform="rotate(-58 285 334)"/>
    <text x="285" y="341" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" letter-spacing="0.08em">VOLUME</text>
    <text x="285" y="495" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">more submissions than</text>
    <text x="285" y="515" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">the calendar absorbs</text>
  </g>

  <text x="468" y="344" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="42">×</text>

  <g aria-label="Capacity">
    <circle cx="650" cy="334" r="118" fill="url(#lens)" fill-opacity="0.05" stroke="#d2d2d7" stroke-width="2"/>
    <circle cx="650" cy="334" r="118" fill="none" stroke="url(#lens)" stroke-width="12" stroke-linecap="round" stroke-dasharray="270 472" transform="rotate(54 650 334)"/>
    <text x="650" y="341" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" letter-spacing="0.08em">CAPACITY</text>
    <text x="650" y="495" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">senior review hours</text>
    <text x="650" y="515" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">are fixed</text>
  </g>

  <text x="833" y="344" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="42">×</text>

  <g aria-label="Exposure">
    <circle cx="1015" cy="334" r="118" fill="url(#lens)" fill-opacity="0.05" stroke="#d2d2d7" stroke-width="2"/>
    <circle cx="1015" cy="334" r="118" fill="none" stroke="url(#lens)" stroke-width="12" stroke-linecap="round" stroke-dasharray="270 472" transform="rotate(166 1015 334)"/>
    <text x="1015" y="341" text-anchor="middle" fill="#1d1d1f" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="21" font-weight="600" letter-spacing="0.08em">EXPOSURE</text>
    <text x="1015" y="495" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">someone can ask you</text>
    <text x="1015" y="515" text-anchor="middle" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13">why</text>
  </g>

  <text x="1160" y="344" text-anchor="middle" fill="#1d1d1f" font-family="Menlo, ui-monospace, monospace" font-size="42">=</text>

  <g aria-label="The job">
    <rect x="1190" y="174" width="310" height="320" rx="24" fill="none" stroke="url(#lens)" stroke-width="18" opacity="0.2" filter="url(#softGlow)"/>
    <rect x="1190" y="174" width="310" height="320" rx="24" fill="url(#lens)"/>
    <text x="1224" y="226" fill="#ffffff" font-family="Menlo, ui-monospace, monospace" font-size="15" font-weight="700" letter-spacing="0.15em">THE JOB</text>
    <rect x="1224" y="273" width="224" height="12" rx="6" fill="#ffffff" opacity="0.96"/>
    <rect x="1224" y="308" width="188" height="10" rx="5" fill="#ffffff" opacity="0.58"/>
    <rect x="1224" y="340" width="208" height="10" rx="5" fill="#ffffff" opacity="0.58"/>
    <line x1="1224" y1="390" x2="1466" y2="390" stroke="#ffffff" stroke-opacity="0.35"/>
    <text x="1345" y="435" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" font-weight="600">a shortlist you</text>
    <text x="1345" y="458" text-anchor="middle" fill="#ffffff" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" font-weight="600">can defend</text>
  </g>

  <line x1="100" y1="624" x2="1500" y2="624" stroke="#d2d2d7" stroke-width="1"/>
  <text x="100" y="666" fill="#6e6e73" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15">If one factor is missing, this is a different job.</text>
</svg>
