<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The final call stays human</title>
  <desc id="desc">An advisory AI score sits beside a signed human Jury Score that feeds the leaderboard.</desc>
  <defs>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(118 .5 .5)">
      <stop offset="0" stop-color="#6c4cf1"/>
      <stop offset=".32" stop-color="#a99bff"/>
      <stop offset=".68" stop-color="#2ec5e8"/>
      <stop offset="1" stop-color="#36e0c2"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#6e6e73"/>
    </marker>
    <style>
      .sf{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
      .mono{font-family:Menlo,ui-monospace,monospace}
      .eyebrow{font-size:12px;fill:#6e6e73;letter-spacing:.16em}
      .card-title{font-size:17px;font-weight:600;fill:#1d1d1f}
      .score{font-size:84px;font-weight:500;fill:#1d1d1f;letter-spacing:-.04em}
      .small{font-size:11px;fill:#6e6e73;letter-spacing:.05em}
      .flow{font-size:11px;fill:#6e6e73;letter-spacing:.03em}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#fff"/>
  <text x="120" y="92" class="mono eyebrow">THE FINAL CALL</text>

  <rect x="110" y="230" width="360" height="410" rx="22" fill="#fff" stroke="#d2d2d7"/>
  <text x="155" y="292" class="sf card-title">AI Total Score</text>
  <text x="155" y="430" class="mono score">7.2</text>
  <rect x="155" y="492" width="104" height="34" rx="17" fill="#fff" stroke="#d2d2d7"/>
  <text x="207" y="514" text-anchor="middle" class="mono small">advisory</text>

  <rect x="620" y="230" width="360" height="410" rx="22" fill="#fff" stroke="url(#lens)" stroke-width="3"/>
  <text x="665" y="292" class="sf card-title">Jury Score</text>
  <text x="665" y="430" class="mono score">7</text>
  <path d="M665 493C700 466 724 515 758 487S820 509 853 482S900 504 933 476" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/>
  <text x="665" y="544" class="mono small">signed · human</text>

  <rect x="1130" y="230" width="360" height="410" rx="22" fill="#fff" stroke="#d2d2d7"/>
  <text x="1175" y="292" class="sf card-title">Leaderboard</text>
  <g>
    <circle cx="1190" cy="363" r="8" fill="url(#lens)"/>
    <rect x="1220" y="355" width="205" height="16" rx="8" fill="#1d1d1f"/>
    <circle cx="1190" cy="425" r="7" fill="none" stroke="#d2d2d7"/>
    <rect x="1220" y="417" width="172" height="16" rx="8" fill="#d2d2d7"/>
    <circle cx="1190" cy="487" r="7" fill="none" stroke="#d2d2d7"/>
    <rect x="1220" y="479" width="150" height="16" rx="8" fill="#d2d2d7"/>
    <circle cx="1190" cy="549" r="7" fill="none" stroke="#d2d2d7"/>
    <rect x="1220" y="541" width="126" height="16" rx="8" fill="#d2d2d7"/>
  </g>

  <path d="M490 435H596" fill="none" stroke="#6e6e73" stroke-width="1.25" stroke-dasharray="5 7" marker-end="url(#arrow)"/>
  <text x="543" y="410" text-anchor="middle" class="mono flow">read · question · decide</text>
  <path d="M1000 435H1106" fill="none" stroke="#6e6e73" stroke-width="1.25" marker-end="url(#arrow)"/>
</svg>
