[mcp_servers.playwright]
enabled = true
required = false
command = "corepack"
args = [
  "pnpm@11.13.1",
  "exec",
  "playwright-mcp",
  "--headless",
  "--isolated",
  "--browser",
  "chromium",
  "--block-service-workers",
  "--console-level",
  "error",
  "--output-dir",
  "test-results/mcp",
]
cwd = "../web"
startup_timeout_sec = 30
tool_timeout_sec = 90
